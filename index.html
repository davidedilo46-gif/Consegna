<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invio Foto Consegna</title>

    <!-- Icona per Schermata Home (Android e iPhone) -->
    <link rel="apple-touch-icon" href="icona.png">
    <link rel="icon" type="image/png" href="icona.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 28px 20px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            color: #0b2265; /* Blu stile corriere */
            font-size: 22px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 6px 12px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: #25d366;
        }

        .prefix {
            font-size: 20px;
            font-weight: 700;
            color: #475569;
            padding-right: 10px;
            border-right: 2px solid #e2e8f0;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 22px;
            font-weight: 600;
            padding: 8px 10px;
            color: #1e293b;
            width: 100%;
        }

        button {
            background-color: #25d366;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 19px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            background-color: #1eb956;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚚 Consegna GLS</h2>
        <div class="input-group">
            <span class="prefix">+39</span>
            <input type="tel" id="phone" placeholder="Numero cliente" autofocus autocomplete="off">
        </div>
        <button onclick="apriWhatsApp()">Apri WhatsApp</button>
    </div>

    <script>
        function apriWhatsApp() {
            var input = document.getElementById('phone');
            var num = input.value.trim().replace(/\s+/g, ''); // Rimuove eventuali spazi

            if (!num) {
                alert('Inserisci il numero di telefono!');
                return;
            }

            // Testo preimpostato del messaggio
            var testo = encodeURIComponent("Buongiorno! Le confermo che il suo pacco è stato consegnato. Le allego la foto di conferma.");
            
            // Reindirizza a WhatsApp
            window.location.href = "https://wa.me/39" + num + "?text=" + testo;
        }

        // Permette di premere "Invio" sulla tastiera per aprire direttamente WhatsApp
        document.getElementById('phone').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                apriWhatsApp();
            }
        });
    </script>

</body>
</html>
